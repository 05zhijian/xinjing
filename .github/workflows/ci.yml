name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # 与本地开发版本严格一致：Flutter 3.32.4 = Dart 3.8.1，
          # 恰好满足 pubspec 的 sdk ^3.8.1（3.32.0 只带 Dart 3.8.0，会求解失败）
          channel: stable
          flutter-version: '3.32.4'
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # 只跑离线单测（test/）；integration_test 需要真机与真实 key，不进 CI
      - run: flutter test
